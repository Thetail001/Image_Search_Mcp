[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-search-mcp"
version = "0.6.0"
description = "MCP server for Reverse Image Search using PicImageSearch"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Thetail", email = "Thetailaaa@gmail.com"}
]
keywords = ["mcp", "reverse-image-search", "yandex", "saucenao", "tracemoe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "fastmcp>=4.0.10,<5",
    # 参数签名和 httpx client 集成以 3.12.11 为基线。
    "PicImageSearch>=3.12.11,<3.13",
    "httpx>=0.28,<0.29",
    "mcp>=2.3,<3",
    "pydantic>=2,<3",
    "starlette>=0.40,<2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # 限制单个测试的执行时间。
    "pytest-timeout>=2.3",
    # 校验 MCP 结构化输出。
    "jsonschema>=4.0",
]

[project.urls]
Repository = "https://github.com/Thetail001/Image_Search_Mcp"
Issues = "https://github.com/Thetail001/Image_Search_Mcp/issues"

[project.scripts]
image-search-mcp = "image_search_mcp.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# tests/conftest.py 默认拦截未经 mock 的 HTTP 与 DNS 请求。
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:PicImageSearch.*",
]
