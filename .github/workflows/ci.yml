name: CI

# CI 与本地使用同一个检查入口。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 覆盖声明支持的最低 Python 版本。
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装（含开发依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 记录实际解析到的依赖版本
        # 保留解析后的依赖版本，便于排查升级导致的失败。
        run: pip list

      - name: 一键验收（跳过反向测试，反向测试单独一个 job）
        run: ./check.sh --fast

  reverse-tests:
    name: 反向测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装（含开发依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 验证故障注入能被回归测试发现
        # 在临时副本注入缺陷，要求指定测试以断言失败结束。
        run: ./check.sh --reverse-only
